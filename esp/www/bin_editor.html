<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>E6 黑白 BIN 编辑器</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#f1f1ed; --muted:#a5a49d; --subtle:#7f7e77;
    --line:#34332f; --line-strong:#4a4943;
    --panel:#252420; --panel-deep:#1d1c19;
    --paper:#2d2c27; --paper-raised:#35342f;
    --canvas-well:#151512;
    --accent:#c9cac5; --accent-strong:#f2f2ed;
    --focus:#75c7bd; --danger:#f28b82;
  }
  *{box-sizing:border-box}
  body{
    margin:0;height:100vh;overflow:hidden;background:var(--canvas-well);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:#1b1a17;min-height:48px;gap:10px;flex-wrap:wrap;
  }
  header h1{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  header .brand{
    display:inline-block;width:10px;height:14px;border:2px solid var(--accent-strong);
  }
  .header-actions{display:flex;gap:6px;flex-wrap:wrap}
  main{
    display:grid;
    grid-template-columns:minmax(320px,380px) minmax(0,1fr);
    height:calc(100vh - 48px - env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  aside{
    border-right:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:0;
  }
  .workspace{
    overflow:auto;padding:12px;display:grid;place-items:start center;
    background:var(--canvas-well);
  }
  fieldset{
    border:0;border-bottom:1px solid var(--line);margin:0;padding:12px 14px;
    display:grid;gap:10px;
  }
  fieldset:last-child{border-bottom:0}
  legend{padding:0;margin:0 0 4px}
  h3{
    margin:0;font-size:11px;color:var(--subtle);
    text-transform:uppercase;letter-spacing:.08em;font-weight:760;
  }
  label{display:grid;gap:4px;color:var(--muted);font-size:12px;font-weight:650}
  select,input[type=file],input[type=text],input[type=number],textarea{
    width:100%;min-height:32px;padding:6px 8px;
    border:1px solid var(--line);border-radius:4px;
    background:var(--panel-deep);color:var(--ink);
    font:inherit;font-size:13px;
  }
  textarea{
    min-height:52px;resize:vertical;line-height:1.4;
    font-family:inherit;
  }
  input[type=range]{width:100%;accent-color:var(--accent);height:20px}
  button{
    padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;
    background:var(--paper-raised);color:var(--ink);font:inherit;font-size:13px;
    font-weight:700;cursor:pointer;
  }
  button:hover:not(:disabled){
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 18%,var(--paper-raised));
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{
    background:var(--accent-strong);color:#1a1a1a;border-color:var(--accent-strong);
  }
  button.primary:hover:not(:disabled){background:#fff}
  button.danger{border-color:#6a2a2a;color:#ffb4a8}
  button.danger:hover:not(:disabled){background:#3a1414;border-color:#8a3a3a}
  .btn-row{display:flex;gap:6px}
  .btn-row button{flex:1}
  .tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tool-btn{
    padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11px;font-weight:600;
  }
  .tool-btn .icon{font-size:18px;line-height:1}
  .tool-btn.active{
    border-color:var(--focus);
    background:color-mix(in srgb,var(--focus) 25%,var(--paper-raised));
  }

  .style-btn{
    flex:1;padding:7px 0;
    border:1px solid var(--line-strong);border-radius:4px;
    background:var(--paper-raised);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;font-weight:700;cursor:pointer;
    user-select:none;
  }
  .style-btn:hover:not(.active){
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 18%,var(--paper-raised));
  }
  .style-btn.active{
    border-color:var(--focus);
    background:color-mix(in srgb,var(--focus) 25%,var(--paper-raised));
    color:#fff;
  }

  .swatch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .swatch{
    position:relative;aspect-ratio:1;border-radius:4px;
    border:2px solid transparent;cursor:pointer;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
    transition:border-color 0.1s;
  }
  .swatch:hover{border-color:var(--muted)}
  .swatch.active{border-color:var(--focus)}
  .swatch canvas{display:block;width:100%;height:100%}

  .slider-row{
    display:grid;grid-template-columns:56px 1fr 48px;gap:6px;align-items:center;
  }
  .slider-row output{
    text-align:right;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .lock-row{
    display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;
    font-weight:600;
  }
  .lock-row input{margin:0;width:16px;height:16px}
  .lock-row .locked{color:var(--danger)}
  .lock-row .unlocked{color:#7dda7d}
  .canvas-wrap{
    position:relative;display:inline-block;
    background:repeating-conic-gradient(#20201d 0% 25%,#171714 0% 50%) 50%/14px 14px;
    border:1px solid var(--line);border-radius:4px;
    max-width:100%;overflow:hidden;line-height:0;
  }
  .canvas-wrap canvas{
    display:block;max-width:100%;height:auto;
    cursor:crosshair;image-rendering:pixelated;touch-action:none;
  }
  #canvasOverlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;
  }

  .text-preview-box{
    border:1px solid var(--line);
    border-radius:4px;
    background:#000;
    display:grid;place-items:center;
    padding:0;overflow:hidden;
  }
  .text-preview-box canvas{
    display:block;
    max-width:100%;height:auto;
    image-rendering:pixelated;
  }

  .status{
    padding:8px 10px;border-radius:4px;font-size:12px;line-height:1.5;
    background:#1a1a17;color:var(--muted);white-space:pre-wrap;
  }
  .status.ok{color:#7dda7d;background:#132013}
  .status.err{color:var(--danger);background:#2a1414}
  .status.busy{color:#7db8da;background:#132033}
  .info{font-size:11px;color:var(--subtle);line-height:1.4;margin-top:4px}

  @media (max-width:820px){
    body{
      height:auto;min-height:100vh;overflow:auto;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    main{grid-template-columns:1fr;height:auto;padding-bottom:0}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    .workspace{padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
  }
</style>
</head>
<body data-nav-page="edit" data-nav-layout="fixed">

<header>
  <h1><span class="brand"></span>E6 黑白 BIN 编辑器</h1>
  <div class="header-actions">
    <button type="button" id="loadBtn">打开 BIN</button>
    <button type="button" id="saveBtn">保存 BIN</button>
    <button type="button" id="displayBtn" class="primary">显示到屏幕</button>
  </div>
</header>

<main>
  <aside>
    <fieldset>
      <legend><h3>文件</h3></legend>
      <input type="file" id="fileInput" accept=".bin" hidden>
      <div class="info" id="fileInfo">未加载文件</div>
    </fieldset>

    <fieldset>
      <legend><h3>工具</h3></legend>
      <div class="tool-grid">
        <button type="button" class="tool-btn active" data-tool="pencil">
          <span class="icon">✏️</span><span>画笔</span>
        </button>
        <button type="button" class="tool-btn" data-tool="eraser">
          <span class="icon">🧽</span><span>橡皮</span>
        </button>
        <button type="button" class="tool-btn" data-tool="eyedropper">
          <span class="icon">💧</span><span>吸管</span>
        </button>
      </div>
      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">笔刷</span>
        <input type="range" id="brushSize" min="2" max="32" step="2" value="4">
        <output id="brushSizeVal">4</output>
      </div>
    </fieldset>

    <fieldset>
      <legend><h3>基础色</h3></legend>
      <div class="swatch-grid" id="basicSwatches"></div>
      <div class="info">黑白墨水屏仅支持黑、白两色。</div>
    </fieldset>

    <fieldset>
      <legend><h3>背景色</h3></legend>
      <div class="swatch-grid" id="bgSwatches"></div>
      <div class="info">两层都透明的位置显示此颜色，导出时也会用它填充。</div>
    </fieldset>

    <fieldset>
      <legend><h3>导入层锁定</h3></legend>
      <label class="lock-row">
        <input type="checkbox" id="lockContent">
        <span id="lockLabel" class="unlocked">未锁定 · 橡皮可穿透擦除 BIN</span>
      </label>
      <div class="info">
        锁定时：橡皮只擦除你画的笔画和文字，导入的 BIN 内容受保护。<br>
        未锁定：橡皮会把笔画和下方的 BIN 内容一起擦掉，露出背景色。
      </div>
    </fieldset>

    <fieldset>
      <legend><h3>文字</h3></legend>
      <label>内容（支持换行）
        <textarea id="textInput" rows="2" placeholder="输入要放置的文字&#10;支持多行，回车换行"></textarea>
      </label>

      <div style="display:flex;gap:8px">
        <label style="flex:1">字体
          <select id="fontSelect">
            <option value="sans-serif">无衬线</option>
            <option value="serif">衬线</option>
            <option value="monospace">等宽</option>
          </select>
        </label>
        <label style="flex:1">字号
          <input type="number" id="fontSize" value="32" min="6" max="240">
        </label>
      </div>

      <label>书写方向
        <select id="directionSelect">
          <option value="horizontal">横排（左 → 右）</option>
          <option value="vertical-lr">竖排（列 左 → 右）</option>
          <option value="vertical-rl">竖排（列 右 → 左）</option>
        </select>
      </label>

      <div style="display:flex;gap:8px;align-items:flex-end">
        <label style="flex:1">对齐
          <select id="alignSelect">
            <option value="left">左对齐</option>
            <option value="center">居中</option>
            <option value="right">右对齐</option>
          </select>
        </label>
        <div style="flex:1.2">
          <div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px">样式</div>
          <div style="display:flex;gap:4px">
            <button type="button" class="style-btn" id="boldBtn" title="加粗"><b>B</b></button>
            <button type="button" class="style-btn" id="italicBtn" title="斜体"><i>I</i></button>
            <button type="button" class="style-btn" id="underlineBtn" title="下划线"><u>U</u></button>
          </div>
        </div>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">行高</span>
        <input type="range" id="lineHeightSlider" min="0.8" max="2.5" step="0.1" value="1.2">
        <output id="lineHeightVal">1.2</output>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">字间距</span>
        <input type="range" id="letterSpacingSlider" min="-20" max="40" step="1" value="0">
        <output id="letterSpacingVal">0</output>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">旋转</span>
        <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
        <output id="rotateVal">0°</output>
      </div>

      <div class="info">预览（黑底白字，实际颜色为画笔色）</div>
      <div class="text-preview-box">
        <canvas id="textPreviewCanvas" width="240" height="140"></canvas>
      </div>

      <button type="button" id="placeTextBtn">放置文字</button>
      <div class="info">点击后在画布上点一次确定锚点位置，Esc 取消。</div>
    </fieldset>

    <fieldset>
      <legend><h3>历史 / 清空</h3></legend>
      <div class="btn-row">
        <button type="button" id="undoBtn" disabled>撤销</button>
        <button type="button" id="redoBtn" disabled>重做</button>
      </div>
      <div class="btn-row">
        <button type="button" id="clearBtn">清空绘制层</button>
      </div>
      <div class="btn-row">
        <button type="button" id="clearAllBtn" class="danger">清空全部</button>
      </div>
      <div class="info">清空后可用 Ctrl+Z 撤销。清空全部会自动解锁导入层。</div>
    </fieldset>

    <fieldset>
      <div id="status" class="status">就绪</div>
    </fieldset>
  </aside>

  <section class="workspace">
    <div class="canvas-wrap">
      <canvas id="canvasMain" width="800" height="480"></canvas>
      <canvas id="canvasOverlay" width="800" height="480"></canvas>
    </div>
  </section>
</main>

<script>
(function(){
'use strict';

console.log('[E6 Editor] script start');

const W = 800, H = 480;
const FRAME_BYTES = W * H / 8;  // 48000 字节
const TRANSPARENT = 255;

// 索引 0=黑，1=白
const PALETTE = [
  { id:'black',  hex:'#000000' },
  { id:'white',  hex:'#FFFFFF' },
];

let binLayer = new Uint8Array(W * H);
let drawLayer = new Uint8Array(W * H);
binLayer.fill(TRANSPARENT);
drawLayer.fill(TRANSPARENT);

let bgColorIdx = 1;
let contentLocked = false;

let currentColor = { index: 0 };
let currentTool = 'pencil';
let brushSize = 4;
let textModeActive = false;

function snapshot() {
  return {
    bin:  new Uint8Array(binLayer),
    draw: new Uint8Array(drawLayer),
  };
}

function restore(snap) {
  binLayer  = new Uint8Array(snap.bin);
  drawLayer = new Uint8Array(snap.draw);
}

const undoStack = [snapshot()];
const redoStack = [];
const MAX_HISTORY = 30;

const $ = id => document.getElementById(id);
const canvasMain = $('canvasMain');
const canvasOverlay = $('canvasOverlay');
const ctxMain = canvasMain.getContext('2d', { willReadFrequently:true });
const ctxOverlay = canvasOverlay.getContext('2d');

let renderPending = false;
let drawing = false;
let lastX = -1, lastY = -1;
let currentPointerId = null;

function resolveIndex(x, y) {
  const i = y * W + x;
  let v = drawLayer[i];
  if (v === TRANSPARENT) v = binLayer[i];
  if (v === TRANSPARENT) v = bgColorIdx;
  return v;
}

function requestRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; render(); });
}

function render() {
  const img = ctxMain.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < W * H; i++) {
    let v = drawLayer[i];
    if (v === TRANSPARENT) v = binLayer[i];
    if (v === TRANSPARENT) v = bgColorIdx;
    const hex = PALETTE[v].hex;
    d[i*4]   = parseInt(hex.slice(1,3), 16);
    d[i*4+1] = parseInt(hex.slice(3,5), 16);
    d[i*4+2] = parseInt(hex.slice(5,7), 16);
    d[i*4+3] = 255;
  }
  ctxMain.putImageData(img, 0, 0);
}

/* 1bpp 解包 */
function unpack(buf) {
  const out = new Uint8Array(W * H);
  const rowBytes = W >> 3;
  for (let y = 0; y < H; y++) {
    const rowBase = y * rowBytes;
    for (let x = 0; x < W; x++) {
      const b = buf[rowBase + (x >> 3)];
      const bit = (b >> (7 - (x & 7))) & 1;
      out[y*W + x] = bit ? 0 : 1;  // 1表示黑，转成 0；0表示白，转成 1
    }
  }
  return out;
}

/* 1bpp 打包 */
function packLayers() {
  const buf = new Uint8Array(FRAME_BYTES);
  const rowBytes = W >> 3;
  for (let y = 0; y < H; y++) {
    const rowBase = y * rowBytes;
    for (let x = 0; x < W; x++) {
      const idx = resolveIndex(x, y);
      if (idx === 0) {  // 黑色
        buf[rowBase + (x >> 3)] |= (0x80 >> (x & 7));
      }
    }
  }
  return buf;
}

function getCanvasCoord(e) {
  const rect = canvasMain.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * W / rect.width);
  const y = Math.floor((e.clientY - rect.top)  * H / rect.height);
  return { x: Math.max(0, Math.min(W - 1, x)), y: Math.max(0, Math.min(H - 1, y)) };
}

function saveHistory() {
  undoStack.push(snapshot());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}

function updateHistoryButtons() {
  $('undoBtn').disabled = undoStack.length <= 1;
  $('redoBtn').disabled = redoStack.length === 0;
}

function undo() {
  if (undoStack.length <= 1) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
  render();
  updateHistoryButtons();
  setStatus('已撤销');
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  render();
  updateHistoryButtons();
  setStatus('已重做');
}

function paintPixelAt(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x;

  if (currentTool === 'eraser') {
    drawLayer[i] = TRANSPARENT;
    if (!contentLocked) binLayer[i] = TRANSPARENT;
  } else {
    drawLayer[i] = currentColor.index;
  }
}

function paintBrush(cx, cy) {
  const half = Math.floor(brushSize / 2);
  for (let dy = -half; dy < brushSize - half; dy++) {
    for (let dx = -half; dx < brushSize - half; dx++) {
      paintPixelAt(cx + dx, cy + dy);
    }
  }
}

function drawLine(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0);
  const dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1;
  const sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while (true) {
    paintBrush(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 <  dx) { err += dx; y0 += sy; }
  }
}

function pickColorAt(x, y) {
  const R = 5;
  let blackCount = 0, total = 0;
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const px = x + dx, py = y + dy;
      if (px < 0 || px >= W || py < 0 || py >= H) continue;
      if (resolveIndex(px, py) === 0) blackCount++;
      total++;
    }
  }
  if (total === 0) return;

  if (blackCount / total > 0.5) {
    currentColor = { index: 0 };
    setStatus('已取色：黑', 'ok');
  } else {
    currentColor = { index: 1 };
    setStatus('已取色：白', 'ok');
  }
  updateColorUI();
}

function getTextMetrics() {
  const text = $('textInput').value;
  const font = $('fontSelect').value;
  const size = Math.max(6, parseInt($('fontSize').value) || 32);
  const bold = $('boldBtn').classList.contains('active');
  const italic = $('italicBtn').classList.contains('active');
  const underline = $('underlineBtn').classList.contains('active');
  const rotate = parseFloat($('rotateSlider').value) || 0;
  const align = $('alignSelect').value;
  const direction = $('directionSelect').value;
  const lineHeight = parseFloat($('lineHeightSlider').value) || 1.2;
  const letterSpacing = parseInt($('letterSpacingSlider').value, 10) || 0;

  const style = (italic ? 'italic ' : '') + (bold ? 'bold ' : '');
  const fontSpec = `${style}${size}px ${font}`;
  return { text, fontSpec, size, underline, rotate, align, direction,
           lineHeight, bold, italic, letterSpacing };
}

function drawHorizontalText(ctx, m) {
  const lines = m.text.split('\n');
  const lineHeightPx = m.size * m.lineHeight;
  const ls = m.letterSpacing || 0;
  const underlineThickness = Math.max(1, Math.round(m.size / 14));
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';

  for (let i = 0; i < lines.length; i++) {
    const chars = Array.from(lines[i]);
    if (chars.length === 0) continue;

    let lineW = 0;
    for (let j = 0; j < chars.length; j++) {
      lineW += ctx.measureText(chars[j]).width;
      if (j < chars.length - 1) lineW += ls;
    }

    let startX = 0;
    if (m.align === 'center') startX = -lineW / 2;
    else if (m.align === 'right') startX = -lineW;

    const ly = i * lineHeightPx;
    let cx = startX;
    for (let j = 0; j < chars.length; j++) {
      ctx.fillText(chars[j], cx, ly);
      cx += ctx.measureText(chars[j]).width + ls;
    }

    if (m.underline) {
      ctx.fillRect(startX, ly + m.size * 0.9, lineW, underlineThickness);
    }
  }
}

function drawVerticalText(ctx, m) {
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  const lines = m.text.split('\n');
  const lineHeightPx = m.size * m.lineHeight;
  const ls = m.letterSpacing || 0;
  const colWidth = Math.max(1, lineHeightPx + ls);
  const totalWidth = lines.length * colWidth;
  const underlineThickness = Math.max(1, Math.round(m.size / 14));

  let offsetX = 0;
  if (m.align === 'center') offsetX = -totalWidth / 2;
  else if (m.align === 'right') offsetX = -totalWidth;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const chars = Array.from(line);

    let colCenterX;
    if (m.direction === 'vertical-lr') {
      colCenterX = offsetX + colWidth * (i + 0.5);
    } else {
      colCenterX = offsetX + totalWidth - colWidth * (i + 0.5);
    }

    for (let j = 0; j < chars.length; j++) {
      const ch = chars[j];
      if (ch === ' ' || ch === '\t') continue;
      const cy = j * colWidth + colWidth / 2;
      ctx.fillText(ch, colCenterX, cy);
    }

    if (m.underline && chars.length > 0) {
      let maxCharW = 0;
      for (const ch of chars) {
        const w = ctx.measureText(ch).width;
        if (w > maxCharW) maxCharW = w;
      }
      const lineX = colCenterX + maxCharW / 2 + 1;
      const lineY1 = colWidth * 0.1;
      const lineY2 = chars.length * colWidth - colWidth * 0.1;
      ctx.fillRect(lineX, lineY1, underlineThickness, lineY2 - lineY1);
    }
  }
}

function drawTextOnCanvas(ctx, x, y, m, fillStyle) {
  ctx.save();
  ctx.font = m.fontSpec;
  ctx.fillStyle = fillStyle;

  ctx.translate(x, y);
  if (m.rotate !== 0) {
    ctx.rotate(m.rotate * Math.PI / 180);
  }

  if (m.direction === 'horizontal') {
    drawHorizontalText(ctx, m);
  } else {
    drawVerticalText(ctx, m);
  }

  ctx.restore();
}

function measureTextBBox(m) {
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d');
  ctx.font = m.fontSpec;

  const lineHeightPx = m.size * m.lineHeight;
  const ls = m.letterSpacing || 0;
  const lines = m.text.split('\n');

  if (m.direction === 'horizontal') {
    let maxW = 0;
    for (const line of lines) {
      const chars = Array.from(line);
      let w = 0;
      for (let j = 0; j < chars.length; j++) {
        w += ctx.measureText(chars[j]).width;
        if (j < chars.length - 1) w += ls;
      }
      if (w > maxW) maxW = w;
    }
    return {
      w: Math.max(1, maxW),
      h: Math.max(1, lines.length * lineHeightPx)
    };
  } else {
    const colWidth = Math.max(1, lineHeightPx + ls);
    let maxChars = 0;
    for (const line of lines) {
      maxChars = Math.max(maxChars, Array.from(line).length);
    }
    return {
      w: Math.max(1, lines.length * colWidth),
      h: Math.max(1, maxChars * colWidth)
    };
  }
}

function renderTextPreviewBox() {
  const cvs = $('textPreviewCanvas');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  const CW = cvs.width, CH = cvs.height;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);

  const m = getTextMetrics();
  if (!m.text.trim()) {
    ctx.fillStyle = '#555';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('（无文字）', CW / 2, CH / 2);
    return;
  }

  const bbox = measureTextBBox(m);
  if (bbox.w <= 0 || bbox.h <= 0) return;

  const rotRad = Math.abs(m.rotate) * Math.PI / 180;
  const cos = Math.abs(Math.cos(rotRad));
  const sin = Math.abs(Math.sin(rotRad));
  const boundW = bbox.w * cos + bbox.h * sin;
  const boundH = bbox.w * sin + bbox.h * cos;

  const pad = 8;
  const scale = Math.min(
    (CW - 2 * pad) / Math.max(boundW, 1),
    (CH - 2 * pad) / Math.max(boundH, 1),
    1
  );

  let cRelX = 0;
  if (m.align === 'left') cRelX = bbox.w / 2;
  else if (m.align === 'right') cRelX = -bbox.w / 2;
  const cRelY = bbox.h / 2;

  ctx.save();
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(scale, scale);
  drawTextOnCanvas(ctx, -cRelX, -cRelY, m, '#fff');
  ctx.restore();
}

function renderTextPreview(x, y) {
  ctxOverlay.clearRect(0, 0, W, H);
  const m = getTextMetrics();
  if (!m.text) return;
  ctxOverlay.save();
  ctxOverlay.globalAlpha = 0.75;
  drawTextOnCanvas(ctxOverlay, x, y, m, 'rgba(117,199,189,1)');
  ctxOverlay.restore();
}

function drawTextToDrawLayer(x, y) {
  const m = getTextMetrics();
  if (!m.text) return false;

  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  drawTextOnCanvas(octx, x, y, m, '#fff');

  const img = octx.getImageData(0, 0, W, H);
  const d = img.data;
  let count = 0;
  for (let i = 0; i < W * H; i++) {
    if (d[i*4 + 3] > 128) {
      drawLayer[i] = currentColor.index;
      count++;
    }
  }
  return count > 0;
}

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
  console.log('[E6 Editor] status:', text);
}

function buildSwatches() {
  const basic = $('basicSwatches');
  basic.innerHTML = '';
  PALETTE.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.title = p.id;
    el.style.background = p.hex;
    el.dataset.kind = 'basic';
    el.dataset.index = String(i);
    el.addEventListener('click', () => {
      currentColor = { index:i };
      updateColorUI();
    });
    basic.appendChild(el);
  });

  const bg = $('bgSwatches');
  bg.innerHTML = '';
  PALETTE.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.title = '背景 ' + p.id;
    el.style.background = p.hex;
    el.dataset.kind = 'bg';
    el.dataset.index = String(i);
    el.addEventListener('click', () => {
      bgColorIdx = i;
      updateColorUI();
      render();
      setStatus('背景色：' + p.id);
    });
    bg.appendChild(el);
  });
}

function updateColorUI() {
  document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.swatch[data-kind="bg"]').forEach(el => {
    if (parseInt(el.dataset.index) === bgColorIdx) el.classList.add('active');
  });

  const el = document.querySelector('.swatch[data-kind="basic"][data-index="' + currentColor.index + '"]');
  if (el) el.classList.add('active');
}

function updateToolUI() {
  document.querySelectorAll('.tool-btn').forEach(el => {
    el.classList.toggle('active', el.dataset.tool === currentTool);
  });
  canvasMain.style.cursor = textModeActive ? 'text' : 'crosshair';
}

function updateLockUI() {
  const label = $('lockLabel');
  if (contentLocked) {
    label.textContent = '已锁定 · 橡皮只擦笔画和文字';
    label.className = 'locked';
  } else {
    label.textContent = '未锁定 · 橡皮可穿透擦除 BIN';
    label.className = 'unlocked';
  }
}

async function displayToScreen() {
  const btn = $('displayBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '上传中…';
  setStatus('正在上传到设备，屏幕刷新约需 2~5 秒…', 'busy');

  try {
    const buf = packLayers();
    const r = await fetch('/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: buf
    });
    const text = await r.text();
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + text);
    setStatus('已显示在屏幕上（设备接收 ' + text + ' 字节）', 'ok');
  } catch (e) {
    setStatus('显示失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function bindEvents() {
  document.querySelectorAll('.tool-btn').forEach(el => {
    el.addEventListener('click', () => {
      currentTool = el.dataset.tool;
      if (textModeActive) {
        textModeActive = false;
        ctxOverlay.clearRect(0, 0, W, H);
      }
      updateToolUI();
    });
  });

  $('brushSize').addEventListener('input', () => {
    brushSize = parseInt($('brushSize').value) || 4;
    $('brushSizeVal').textContent = brushSize;
  });

  $('lockContent').addEventListener('change', () => {
    contentLocked = $('lockContent').checked;
    updateLockUI();
    setStatus(
      contentLocked ? '导入层已锁定：橡皮只擦笔画和文字' : '导入层已解锁：橡皮可穿透擦除 BIN 内容',
      contentLocked ? 'err' : 'ok'
    );
  });

  $('textInput').addEventListener('input', () => {
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });
  $('fontSelect').addEventListener('change', renderTextPreviewBox);
  $('fontSize').addEventListener('input', renderTextPreviewBox);
  $('directionSelect').addEventListener('change', () => {
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });
  $('alignSelect').addEventListener('change', () => {
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });

  ['boldBtn','italicBtn','underlineBtn'].forEach(id => {
    $(id).addEventListener('click', () => {
      $(id).classList.toggle('active');
      renderTextPreviewBox();
      if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
    });
  });

  $('lineHeightSlider').addEventListener('input', () => {
    $('lineHeightVal').textContent = parseFloat($('lineHeightSlider').value).toFixed(1);
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });

  $('letterSpacingSlider').addEventListener('input', () => {
    $('letterSpacingVal').textContent = $('letterSpacingSlider').value;
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });

  $('rotateSlider').addEventListener('input', () => {
    $('rotateVal').textContent = $('rotateSlider').value + '°';
    renderTextPreviewBox();
    if (textModeActive) ctxOverlay.clearRect(0, 0, W, H);
  });

  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);

  $('clearBtn').addEventListener('click', () => {
    saveHistory();
    drawLayer.fill(TRANSPARENT);
    render();
    setStatus('已清空绘制层（画笔和文字已清除，可 Ctrl+Z 撤销）', 'ok');
  });

  $('clearAllBtn').addEventListener('click', () => {
    let unlockedMsg = '';
    if (contentLocked) {
      contentLocked = false;
      $('lockContent').checked = false;
      updateLockUI();
      unlockedMsg = '（已自动解锁导入层）';
    }
    saveHistory();
    drawLayer.fill(TRANSPARENT);
    binLayer.fill(TRANSPARENT);
    render();
    setStatus('已清空全部' + unlockedMsg + '，可 Ctrl+Z 撤销', 'ok');
  });

  $('loadBtn').addEventListener('click', () => $('fileInput').click());

  $('fileInput').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const buf = new Uint8Array(await f.arrayBuffer());
      if (buf.length !== FRAME_BYTES) {
        setStatus('文件大小错误：' + buf.length + ' 字节，应为 ' + FRAME_BYTES, 'err');
        return;
      }
      saveHistory();
      binLayer = unpack(buf);
      drawLayer.fill(TRANSPARENT);
      render();
      $('fileInfo').textContent = '已加载：' + f.name + '（' + buf.length + ' 字节）';
      setStatus('BIN 已加载到导入层（绘制层已清空）', 'ok');
    } catch (err) {
      setStatus('加载失败：' + err.message, 'err');
    } finally {
      e.target.value = '';
    }
  });

  $('saveBtn').addEventListener('click', () => {
    try {
      const buf = packLayers();
      const blob = new Blob([buf], { type:'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'image_bw_' + Date.now() + '.bin';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setStatus('已保存 ' + buf.length + ' 字节', 'ok');
    } catch (e) {
      setStatus('保存失败：' + e.message, 'err');
    }
  });

  $('displayBtn').addEventListener('click', displayToScreen);

  $('placeTextBtn').addEventListener('click', () => {
    const text = $('textInput').value;
    if (!text) { setStatus('请先输入文字', 'err'); return; }
    textModeActive = true;
    updateToolUI();
    setStatus('点击画布放置文字：' + (text.split('\n')[0].slice(0,20) || '…'));
  });

  canvasMain.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const { x, y } = getCanvasCoord(e);

    if (textModeActive) {
      saveHistory();
      const ok = drawTextToDrawLayer(x, y);
      if (ok) {
        textModeActive = false;
        ctxOverlay.clearRect(0, 0, W, H);
        render();
        updateToolUI();
        setStatus('文字已放置（在绘制层）', 'ok');
      } else {
        undoStack.pop();
        setStatus('文字未产生任何像素', 'err');
      }
      return;
    }

    if (currentTool === 'eyedropper') {
      pickColorAt(x, y);
      return;
    }

    saveHistory();
    drawing = true;
    currentPointerId = e.pointerId;
    try { canvasMain.setPointerCapture(e.pointerId); } catch(_) {}
    lastX = x; lastY = y;
    paintBrush(x, y);
    requestRender();
  });

  canvasMain.addEventListener('pointermove', (e) => {
    const { x, y } = getCanvasCoord(e);

    if (textModeActive && !drawing) {
      renderTextPreview(x, y);
      return;
    }
    if (!drawing) return;
    drawLine(lastX, lastY, x, y);
    lastX = x; lastY = y;
    requestRender();
  });

  const endDraw = () => {
    if (!drawing) return;
    drawing = false;
    if (currentPointerId !== null) {
      try { canvasMain.releasePointerCapture(currentPointerId); } catch(_) {}
      currentPointerId = null;
    }
    render();
  };
  canvasMain.addEventListener('pointerup', endDraw);
  canvasMain.addEventListener('pointercancel', endDraw);
  canvasMain.addEventListener('pointerleave', () => {
    if (textModeActive && !drawing) ctxOverlay.clearRect(0, 0, W, H);
    if (drawing) endDraw();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      if (e.shiftKey) redo(); else undo();
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
      redo(); e.preventDefault();
    } else if (e.key === 'Escape' && textModeActive) {
      textModeActive = false;
      ctxOverlay.clearRect(0, 0, W, H);
      updateToolUI();
      setStatus('已取消文字放置');
    }
  });
}

function init() {
  buildSwatches();
  updateColorUI();
  updateToolUI();
  updateLockUI();
  updateHistoryButtons();
  bindEvents();
  render();
  renderTextPreviewBox();
  setStatus('就绪：打开 BIN 或直接在空白画布上绘制');
}

init();

})();
</script>
<script src="/nav.js"></script>
</body>
