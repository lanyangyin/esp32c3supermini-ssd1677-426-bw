<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BIN 编辑器 (16级灰度 / 1bpp)</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#f1f1ed; --muted:#a5a49d; --subtle:#7f7e77;
    --line:#34332f; --line-strong:#4a4943;
    --panel:#252420; --panel-deep:#1d1c19;
    --paper:#2d2c27; --paper-raised:#35342f;
    --canvas-well:#151512;
    --accent:#c9cac5; --accent-strong:#f2f2ed;
    --focus:#75c7bd; --danger:#f28b82;
  }
  *{box-sizing:border-box}
  body{
    margin:0;height:100vh;overflow:hidden;background:var(--canvas-well);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:#1b1a17;min-height:48px;gap:10px;flex-wrap:wrap;
  }
  header h1{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  header .brand{display:inline-block;width:10px;height:14px;border:2px solid var(--accent-strong);}
  .header-actions{display:flex;gap:6px;flex-wrap:wrap}
  main{
    display:grid;
    grid-template-columns:minmax(320px,380px) minmax(0,1fr);
    height:calc(100vh - 48px - 60px - env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  aside{
    border-right:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:0;
  }
  .workspace{
    overflow:auto;padding:12px;display:grid;place-items:start center;
    background:var(--canvas-well);
  }
  fieldset{
    border:0;border-bottom:1px solid var(--line);margin:0;padding:12px 14px;
    display:grid;gap:10px;
  }
  fieldset:last-child{border-bottom:0}
  legend{padding:0;margin:0 0 4px}
  h3{
    margin:0;font-size:11px;color:var(--subtle);
    text-transform:uppercase;letter-spacing:.08em;font-weight:760;
  }
  label{display:grid;gap:4px;color:var(--muted);font-size:12px;font-weight:650}
  select,input[type=file],input[type=text],input[type=number],textarea{
    width:100%;min-height:32px;padding:6px 8px;
    border:1px solid var(--line);border-radius:4px;
    background:var(--panel-deep);color:var(--ink);
    font:inherit;font-size:13px;
  }
  textarea{
    min-height:52px;resize:vertical;line-height:1.4;
    font-family:inherit;
  }
  input[type=range]{width:100%;accent-color:var(--accent);height:20px}
  button{
    padding:9px 12px;border:1px solid var(--line-strong);border-radius:4px;
    background:var(--paper-raised);color:var(--ink);font:inherit;font-size:13px;
    font-weight:700;cursor:pointer;
  }
  button:hover:not(:disabled){
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 18%,var(--paper-raised));
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{
    background:var(--accent-strong);color:#1a1a1a;border-color:var(--accent-strong);
  }
  button.primary:hover:not(:disabled){background:#fff}
  button.danger{border-color:#6a2a2a;color:#ffb4a8}
  button.danger:hover:not(:disabled){background:#3a1414;border-color:#8a3a3a}
  .btn-row{display:flex;gap:6px}
  .btn-row button{flex:1}
  .tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tool-btn{
    padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:11px;font-weight:600;
  }
  .tool-btn .icon{font-size:18px;line-height:1}
  .tool-btn.active{
    border-color:var(--focus);
    background:color-mix(in srgb,var(--focus) 25%,var(--paper-raised));
  }

  .style-btn{
    flex:1;padding:7px 0;
    border:1px solid var(--line-strong);border-radius:4px;
    background:var(--paper-raised);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;font-weight:700;cursor:pointer;
    user-select:none;
  }
  .style-btn:hover:not(.active){
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 18%,var(--paper-raised));
  }
  .style-btn.active{
    border-color:var(--focus);
    background:color-mix(in srgb,var(--focus) 25%,var(--paper-raised));
    color:#fff;
  }

  .swatch-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
  .swatch{
    position:relative;aspect-ratio:1;border-radius:2px;
    border:2px solid transparent;cursor:pointer;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.5);
    transition:border-color 0.1s;
  }
  .swatch:hover{border-color:var(--muted)}
  .swatch.active{border-color:var(--focus)}
  .swatch span {
    position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.5);color:#fff;
    font-size:8px;line-height:10px;padding:0 2px;
  }
  .swatch.transparent {
    background: repeating-conic-gradient(#20201d 0% 25%,#171714 0% 50%) 50%/10px 10px;
  }

  .slider-row{
    display:grid;grid-template-columns:56px 1fr 48px;gap:6px;align-items:center;
  }
  .slider-row output{
    text-align:right;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .lock-row{
    display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;
    font-weight:600;
  }
  .lock-row input{margin:0;width:16px;height:16px}
  .lock-row .locked{color:var(--danger)}
  .lock-row .unlocked{color:#7dda7d}
  .canvas-wrap{
    position:relative;display:inline-block;
    background:repeating-conic-gradient(#20201d 0% 25%,#171714 0% 50%) 50%/20px 20px;
    border:1px solid var(--line);border-radius:4px;
    max-width:100%;overflow:hidden;line-height:0;
  }
  .canvas-wrap canvas{
    display:block;max-width:100%;height:auto;
    cursor:crosshair;image-rendering:pixelated;touch-action:none;
  }
  #canvasOverlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;
  }

  .text-preview-box{
    border:1px solid var(--line);
    border-radius:4px;
    background:#000;
    display:grid;place-items:center;
    padding:0;overflow:hidden;
  }
  .text-preview-box canvas{
    display:block;
    max-width:100%;height:auto;
    image-rendering:pixelated;
  }

  .status{
    padding:8px 10px;border-radius:4px;font-size:12px;line-height:1.5;
    background:#1a1a17;color:var(--muted);white-space:pre-wrap;
  }
  .status.ok{color:#7dda7d;background:#132013}
  .status.err{color:var(--danger);background:#2a1414}
  .status.busy{color:#7db8da;background:#132033}
  .info{font-size:11px;color:var(--subtle);line-height:1.4;margin-top:4px}

  @media (max-width:820px){
    body{
      height:auto;min-height:100vh;overflow:auto;
      padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px) + 12px);
    }
    main{grid-template-columns:1fr;height:auto;padding-bottom:0}
    aside{border-right:0;border-bottom:1px solid var(--line)}
    .workspace{padding-bottom:calc(16px + 60px + env(safe-area-inset-bottom, 0px))}
  }
</style>
</head>
<body data-nav-page="edit" data-nav-layout="fixed">

<header>
  <h1><span class="brand"></span>BIN 编辑器 (16级灰度)</h1>
  <div class="header-actions">
    <button type="button" id="loadBtn">打开 BIN</button>
    <button type="button" id="saveBtn">保存 BIN</button>
    <button type="button" id="clearGhostingBtn" class="danger" style="background:#3a1414">去除残影</button>
    <button type="button" id="displayBtn" class="primary">显示到屏幕</button>
    <select id="refreshMode" style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--panel-deep);color:var(--ink);font-size:13px;min-height:32px">
      <option value="full">全刷 (4.2s)</option>
      <option value="fast" selected>快刷 (0.9s)</option>
      <option value="partial">局刷 (0.9s)</option>
    </select>
  </div>
</header>

<main>
  <aside>
    <fieldset>
      <legend><h3>文件</h3></legend>
      <input type="file" id="fileInput" accept=".bin" hidden>
      <div class="info" id="fileInfo">未加载文件</div>
    </fieldset>

    <fieldset>
      <legend><h3>工具</h3></legend>
      <div class="tool-grid">
        <button type="button" class="tool-btn active" data-tool="pencil">
          <span class="icon">✏️</span><span>画笔</span>
        </button>
        <button type="button" class="tool-btn" data-tool="eraser">
          <span class="icon">🧽</span><span>橡皮</span>
        </button>
        <button type="button" class="tool-btn" data-tool="eyedropper">
          <span class="icon">💧</span><span>吸管</span>
        </button>
      </div>
      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">笔刷</span>
        <input type="range" id="brushSize" min="1" max="32" step="1" value="4">
        <output id="brushSizeVal">4</output>
      </div>
    </fieldset>

    <fieldset>
      <legend><h3>灰度调色板</h3></legend>
      <div class="swatch-grid" id="graySwatches"></div>
      <div class="info">0 = 纯黑, 15 = 纯白。选“透明”时绘制层不产生不透明像素。</div>
    </fieldset>

    <fieldset>
      <legend><h3>背景色（底灰）</h3></legend>
      <div class="swatch-grid" id="bgSwatches"></div>
      <div class="info">两层都透明的位置显示此颜色，导出时也会用它填充。</div>
    </fieldset>

    <fieldset>
      <legend><h3>导入层锁定</h3></legend>
      <label class="lock-row">
        <input type="checkbox" id="lockContent">
        <span id="lockLabel" class="unlocked">未锁定 · 橡皮可穿透擦除 BIN</span>
      </label>
      <div class="info">
        锁定时：橡皮只擦除你画的笔画和文字，导入的 BIN 内容受保护。<br>
        未锁定：橡皮会把笔画和下方的 BIN 内容一起擦掉，露出透明背景。
      </div>
    </fieldset>

    <fieldset>
      <legend><h3>文字</h3></legend>
      <label>内容（支持换行）
        <textarea id="textInput" rows="2" placeholder="输入要放置的文字&#10;支持多行，回车换行"></textarea>
      </label>

      <div style="display:flex;gap:8px">
        <label style="flex:1">字体
          <select id="fontSelect">
            <option value="sans-serif">无衬线</option>
            <option value="serif">衬线</option>
            <option value="monospace">等宽</option>
          </select>
        </label>
        <label style="flex:1">字号
          <input type="number" id="fontSize" value="32" min="6" max="240">
        </label>
      </div>

      <label>书写方向
        <select id="directionSelect">
          <option value="horizontal">横排（左 → 右）</option>
          <option value="vertical-lr">竖排（列 左 → 右）</option>
          <option value="vertical-rl">竖排（列 右 → 左）</option>
        </select>
      </label>

      <div style="display:flex;gap:8px;align-items:flex-end">
        <label style="flex:1">对齐
          <select id="alignSelect">
            <option value="left">左对齐</option>
            <option value="center">居中</option>
            <option value="right">右对齐</option>
          </select>
        </label>
        <div style="flex:1.2">
          <div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px">样式</div>
          <div style="display:flex;gap:4px">
            <button type="button" class="style-btn" id="boldBtn" title="加粗"><b>B</b></button>
            <button type="button" class="style-btn" id="italicBtn" title="斜体"><i>I</i></button>
            <button type="button" class="style-btn" id="underlineBtn" title="下划线"><u>U</u></button>
          </div>
        </div>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">行高</span>
        <input type="range" id="lineHeightSlider" min="0.8" max="2.5" step="0.1" value="1.2">
        <output id="lineHeightVal">1.2</output>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">字间距</span>
        <input type="range" id="letterSpacingSlider" min="-20" max="40" step="1" value="0">
        <output id="letterSpacingVal">0</output>
      </div>

      <div class="slider-row">
        <span style="font-size:12px;color:var(--muted);font-weight:650">旋转</span>
        <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
        <output id="rotateVal">0°</output>
      </div>

      <div class="info">预览（黑底白字，实际颜色为画笔色）</div>
      <div class="text-preview-box">
        <canvas id="textPreviewCanvas" width="240" height="140"></canvas>
      </div>

      <button type="button" id="placeTextBtn">放置文字</button>
      <div class="info">点击后在画布上点一次确定锚点位置，Esc 取消。</div>
    </fieldset>

    <fieldset>
      <legend><h3>历史 / 清空</h3></legend>
      <div class="btn-row">
        <button type="button" id="undoBtn" disabled>撤销</button>
        <button type="button" id="redoBtn" disabled>重做</button>
      </div>
      <div class="btn-row">
        <button type="button" id="clearBtn">清空绘制层</button>
      </div>
      <div class="btn-row">
        <button type="button" id="clearAllBtn" class="danger">清空全部</button>
      </div>
      <div class="info">清空后可用 Ctrl+Z 撤销。清空全部会自动解锁导入层。</div>
    </fieldset>

    <fieldset>
      <div id="status" class="status">就绪</div>
    </fieldset>
  </aside>

  <section class="workspace">
    <div class="canvas-wrap">
      <canvas id="canvasMain" width="800" height="480"></canvas>
      <canvas id="canvasOverlay" width="800" height="480"></canvas>
    </div>
  </section>
</main>

<script src="/bin_editor.js"></script>
<script src="/display.js"></script>
<script src="/nav.js"></script>
</body>
</html>
