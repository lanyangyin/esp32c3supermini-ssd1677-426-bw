<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EInkReader</title>
<style>
:root{
  --bg:#f5f5f5;--card:#fff;--ink:#222;--muted:#888;
  --line:#e4e4e4;--accent:#06c;--ok:#0a7a0a;--err:#c00;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,system-ui,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:20px;
}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;min-height:52px;
}
header h1{margin:0;font-size:16px;font-weight:600;flex:1}
header nav{display:flex;gap:6px}
header nav a{
  padding:6px 12px;border-radius:8px;text-decoration:none;
  color:var(--muted);font-size:13px;font-weight:600;
  border:1px solid var(--line);background:#fff;
}
header nav a.active{color:var(--accent);border-color:var(--accent);background:#e6f0ff}
main{max-width:640px;margin:0 auto;padding:14px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.card h2{
  margin:0 0 10px;font-size:14px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;
}
.current-book{font-size:18px;font-weight:600;margin-bottom:6px;word-break:break-all}
.current-info{font-size:13px;color:var(--muted);margin-bottom:12px}
.progress-bar{
  height:6px;background:#eee;border-radius:3px;
  overflow:hidden;margin-bottom:14px;
}
.progress-bar > div{height:100%;background:var(--accent);transition:width .3s}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button{
  flex:1;min-width:90px;padding:12px;border:none;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#fff;
}
.controls button.gray{background:#888}
.controls button:disabled{opacity:.4;cursor:not-allowed}
.upload-area{
  border:2px dashed var(--line);border-radius:10px;
  padding:18px;text-align:center;color:var(--muted);
  font-size:13px;margin-bottom:10px;cursor:pointer;display:block;
}
.upload-area:hover{border-color:var(--accent);background:#f0f6ff}
.upload-area input{display:none}
#uploadBtn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;
  font-size:15px;cursor:pointer;
}
#uploadBtn:disabled{opacity:.4;cursor:not-allowed}
.book-list{display:flex;flex-direction:column;gap:6px}
.book-item{
  padding:10px 12px;border-radius:8px;
  border:1px solid var(--line);background:#fafafa;
  font-size:14px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.book-item:hover{border-color:var(--accent);background:#f0f6ff}
.book-item.active{border-color:var(--accent);background:#e6f0ff;font-weight:600}
.book-item .title{flex:1;word-break:break-all}
.book-item .delete{
  padding:4px 10px;border-radius:6px;
  background:#fff;color:#c00;border:1px solid #f0c0c0;
  font-size:12px;font-weight:600;cursor:pointer;
}
.book-item .delete:hover{background:#fdeaea}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.status{
  padding:10px 12px;border-radius:10px;font-size:13px;
  background:#f0f0f0;color:#444;margin-top:12px;display:none;
}
.status.show{display:block}
.status.busy{background:#e8f1fa;color:#0a5bc8}
.status.ok{background:#e8f6e8;color:#0a7a0a}
.status.err{background:#fdeaea;color:#c00}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.overlay.show{display:flex}
.overlay-content{
  background:#fff;padding:24px 32px;border-radius:12px;
  text-align:center;font-weight:600;
}
.spinner{
  width:32px;height:32px;border:3px solid rgba(0,0,0,.15);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>EInkReader</h1>
  <nav id="nav"></nav>
</header>
<main>
  <div class="card">
    <h2>当前书籍</h2>
    <div class="current-book" id="currentTitle">—</div>
    <div class="current-info" id="currentInfo">未选择</div>
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    <div class="controls">
      <button id="prevBtn" disabled>◀ 上一页</button>
      <button id="nextBtn" disabled>下一页 ▶</button>
      <button id="refreshBtn" class="gray">全刷</button>
    </div>
  </div>

  <div class="card">
    <h2>上传 TXT</h2>
    <label class="upload-area" id="uploadArea">
      <input type="file" id="uploadInput" accept=".txt">
      <div id="uploadHint">点击选择 .txt 文件</div>
      <div style="font-size:11px;margin-top:4px;color:#aaa">建议 &lt; 500KB，UTF-8 编码</div>
    </label>
    <button id="uploadBtn" disabled>上传并打开</button>
  </div>

  <div class="card">
    <h2>书架</h2>
    <div class="book-list" id="bookList">
      <div class="empty">加载中…</div>
    </div>
  </div>

  <div class="status" id="status"></div>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <div class="spinner"></div>
    <div id="overlayText">处理中…</div>
  </div>
</div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };

function setStatus(msg, cls){
  var el = $('status');
  if(!msg){ el.className = 'status'; el.textContent = ''; return; }
  el.className = 'status show' + (cls ? ' ' + cls : '');
  el.textContent = msg;
}
function showOverlay(text){
  $('overlayText').textContent = text || '处理中…';
  $('overlay').classList.add('show');
}
function hideOverlay(){ $('overlay').classList.remove('show'); }

async function loadBooks(){
  try{
    var r = await fetch('/api/books', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    renderCurrent(d.current);
    renderBookList(d.books || [], d.active_name);
  }catch(e){
    $('bookList').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
  }
}

function renderCurrent(cur){
  if(!cur){
    $('currentTitle').textContent = '—';
    $('currentInfo').textContent = '未选择';
    $('progressFill').style.width = '0%';
    $('prevBtn').disabled = true;
    $('nextBtn').disabled = true;
    return;
  }
  $('currentTitle').textContent = cur.title;
  $('currentInfo').textContent = cur.page + ' / ' + cur.total + '  (' + cur.progress + '%)';
  $('progressFill').style.width = cur.progress + '%';
  $('prevBtn').disabled = cur.page <= 1;
  $('nextBtn').disabled = cur.page >= cur.total;
}

function renderBookList(books, activeName){
  var el = $('bookList');
  if(!books.length){
    el.innerHTML = '<div class="empty">书架为空，上传一个 .txt 开始阅读</div>';
    return;
  }
  el.innerHTML = '';
  books.forEach(function(name){
    var item = document.createElement('div');
    item.className = 'book-item' + (name === activeName ? ' active' : '');
    var label = name.endsWith('.txt') ? name.slice(0, -4) : name;
    var title = document.createElement('span');
    title.className = 'title';
    title.textContent = label;
    var del = document.createElement('button');
    del.className = 'delete';
    del.textContent = '删除';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      if(confirm('删除《' + label + '》？')) deleteBook(name);
    });
    item.appendChild(title);
    item.appendChild(del);
    item.addEventListener('click', function(){ openBook(name); });
    el.appendChild(item);
  });
}

async function openBook(name){
  showOverlay('打开《' + name + '》…（约 5 秒）');
  try{
    await fetch('/open?name=' + encodeURIComponent(name));
    setStatus('已打开：' + name, 'ok');
    await loadBooks();
  }catch(e){
    setStatus('打开失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

async function deleteBook(name){
  showOverlay('删除中…');
  try{
    await fetch('/delete?name=' + encodeURIComponent(name));
    setStatus('已删除：' + name, 'ok');
    await loadBooks();
  }catch(e){
    setStatus('删除失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

async function nextPage(){
  showOverlay('翻页中…（约 2 秒）');
  try{
    await fetch('/next');
    await loadBooks();
  }catch(e){
    setStatus('翻页失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

async function prevPage(){
  showOverlay('翻页中…（约 2 秒）');
  try{
    await fetch('/prev');
    await loadBooks();
  }catch(e){
    setStatus('翻页失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

async function refreshAll(){
  showOverlay('全刷中…（约 5 秒）');
  try{
    await fetch('/refresh');
    setStatus('已全刷', 'ok');
  }catch(e){
    setStatus('全刷失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

async function doUpload(){
  var f = $('uploadInput').files[0];
  if(!f) return;
  showOverlay('上传中…');
  try{
    var fd = new FormData();
    fd.append('f', f);
    var r = await fetch('/upload', { method: 'POST', body: fd });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    setStatus('上传成功：' + f.name, 'ok');
    $('uploadInput').value = '';
    $('uploadHint').textContent = '点击选择 .txt 文件';
    $('uploadBtn').disabled = true;
    await loadBooks();
  }catch(e){
    setStatus('上传失败: ' + e.message, 'err');
  }finally{
    hideOverlay();
  }
}

// ---------- 绑定 ----------

$('prevBtn').addEventListener('click', prevPage);
$('nextBtn').addEventListener('click', nextPage);
$('refreshBtn').addEventListener('click', refreshAll);
$('uploadBtn').addEventListener('click', doUpload);

$('uploadInput').addEventListener('change', function(){
  var f = $('uploadInput').files[0];
  if(!f){ $('uploadBtn').disabled = true; return; }
  $('uploadHint').textContent = f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)';
  $('uploadBtn').disabled = false;
});

loadBooks();
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
